<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculator</title>
    
</head>
<body>

    <div class="container-fluid Calc-Body d-flex justify-content-center align-items-center">
        <div class="Calculator container row " >
           <input  id="output" class="col-11"type="text" disabled value="">
           <button id="b-back"class="col-1 Back_button" value=".">
            <i class="fas fa-undo"></i>
            </button>
           <button id="b7"class="col-3 " value="7">7</button>
           <button id="b8"class="col-3 " value="8">8</button>
           <button id="b9"class="col-3 " value="9">9</button>
           <button id="b_divide"class="col-3 " value="/">÷</button>
           <button id="b4"class="col-3 " value="4">4</button>
           <button id="b5"class="col-3 " value="5">5</button>
           <button id="b6"class="col-3 " value="6">6</button>
           <button id="b_sub"class="col-3 " value="-">-</button>
           <button id="b1"class="col-3 " value="1">1</button>
           <button id="b2"class="col-3 " value="2">2</button>
           <button id="b3"class="col-3 " value="3">3</button>
           <button id="b_plus"class="col-3 " value="+">+</button>
           <button id="bC"class="col-3 " value="C">C</button>
           <button id="b0"class="col-3 " value="0">0</button>
           <button id="b-point"class="col-1 " value=".">.</button>
           <button id="b_equal"class="col-2 " value="=">=</button> 
           <button id="b-mult"class="col-3 " value="*">*</button>
        </div>
    </div>
    <script src="script/bootstrap.min.js"></script>
    <script src="script/script.js"></script>
</body>
</html>
